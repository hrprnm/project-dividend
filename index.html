<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project Dividend</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F4F7F8">
  <style>
    :root {
      --bg-main: #F4F7F8;
      --bg-card: #FFFFFF;
      --text-main: #2C3E50;
      --text-muted: #7F8C8D;
      --accent: #5D9CEC;
      --profit-text: #1ABC9C;
      --profit-bg: #E8F8F5;
      --loss-text: #E74C3C;
      --loss-bg: #FDEDEC;
      --border-color: #EAEFF2;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-main);
      padding-bottom: 30px;
    }

    header {
      padding: 20px 20px 12px;
      text-align: center;
      background-color: var(--bg-main);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    /* Tab Navigasi */
    .tabs-wrapper {
      padding: 0 16px 12px;
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }

    .tabs {
      display: flex;
      gap: 8px;
      width: max-content;
    }

    .tab-btn {
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
      box-shadow: 0 3px 8px rgba(93, 156, 236, 0.3);
    }

    .dashboard { padding: 0 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background-color: var(--bg-card);
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      border: 1px solid var(--border-color);
    }

    .card.full-width { grid-column: span 2; }

    .card-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .card-value {
      font-size: 22px;
      font-weight: 700;
      margin-top: 6px;
      color: var(--text-main);
      word-break: break-word;
    }

    .val-profit { color: var(--profit-text); }
    .val-loss { color: var(--loss-text); }

    /* Layout Tabel */
    .table-card {
      background-color: var(--bg-card);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      margin-bottom: 16px;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
    }

    th {
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      text-align: left;
    }

    td { color: var(--text-main); }

    .text-right { text-align: right; }
    .text-center { text-align: center; }

    /* Badge */
    .badge {
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      display: inline-block;
    }

    .badge-profit { background-color: var(--profit-bg); color: var(--profit-text); }
    .badge-loss { background-color: var(--loss-bg); color: var(--loss-text); }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Project Dividend</h1>
    </header>

    <div class="tabs-wrapper">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'all-time')">All-Time</button>
        <button class="tab-btn" onclick="switchTab(event, 'tahunan')">Tahunan</button>
        <button class="tab-btn" onclick="switchTab(event, 'ytd')">YTD</button>
        <button class="tab-btn" onclick="switchTab(event, 'bulanan')">Bulanan</button>
      </div>
    </div>

    <div class="dashboard">
      <!-- ALL-TIME TAB -->
      <div id="all-time" class="tab-content active">
        <div class="card-grid">
          <div class="card full-width">
            <div class="card-title">Total Return</div>
            <div class="card-value val-profit" id="alltime-return">...</div>
          </div>
          <div class="card">
            <div class="card-title">Total Dividen</div>
            <div class="card-value" id="alltime-dividen">...</div>
          </div>
          <div class="card">
            <div class="card-title">Yield on Cost</div>
            <div class="card-value" id="alltime-yoc">...</div>
          </div>
        </div>

        <div class="table-card">
          <div class="card-title">Resume Saham</div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Ticker</th>
                  <th class="text-right">Avg Price</th>
                  <th class="text-right">Return</th>
                </tr>
              </thead>
              <tbody id="resume-table-body">
                <tr><td colspan="3" class="text-center">Memuat data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- TAHUNAN TAB -->
      <div id="tahunan" class="tab-content">
        <div class="table-card">
          <div class="card-title">Performa Tahunan</div>
          <div class="table-container">
            <table>
              <thead>
                <tr><th>Tahun</th><th class="text-right">Dividen</th></tr>
              </thead>
              <tbody id="tahunan-table-body">
                <tr><td colspan="2" class="text-center">Memuat data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- YTD TAB -->
      <div id="ytd" class="tab-content">
        <div class="card-grid">
          <div class="card full-width">
            <div class="card-title">Capaian YTD</div>
            <div class="card-value val-profit" id="ytd-val">...</div>
          </div>
        </div>
      </div>

      <!-- BULANAN TAB -->
      <div id="bulanan" class="tab-content">
        <div class="table-card">
          <div class="card-title">Rekap Bulanan</div>
          <div class="table-container">
            <table>
              <thead>
                <tr><th>Bulan</th><th class="text-right">Dividen</th></tr>
              </thead>
              <tbody id="bulanan-table-body">
                <tr><td colspan="2" class="text-center">Memuat data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(evt, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      if (evt && evt.currentTarget) {
        evt.currentTarget.classList.add('active');
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }

    async function fetchDashboardData() {
      // URL API Baru
      const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_H8_sql8iGdZrPBxi4oCPJlSxe7vxHu3j1-4E32zh0dJ5_-pz9FW71kcNxvdTkGIi/exec?token=12345';
      
      try {
        const response = await fetch(APP_SCRIPT_URL);
        const data = await response.json();
        
        // 1. Render data All-Time
        if (data.allTime) {
          document.getElementById('alltime-return').innerText = data.allTime.totalReturn || '0';
          document.getElementById('alltime-dividen').innerText = data.allTime.totalDividen || '0';
          document.getElementById('alltime-yoc').innerText = data.allTime.yoc || '0%';
        }

        // 2. Render Resume Saham Table
        if (data.resumeSaham && data.resumeSaham.length > 0) {
          let html = '';
          data.resumeSaham.forEach(row => {
            const ticker = row[0] || '-';
            const avgPrice = row[1] || '-';
            const ret = row[2] || '0%';
            const isLoss = String(ret).includes('-');
            const badgeClass = isLoss ? 'badge-loss' : 'badge-profit';

            html += `<tr>
              <td><strong>${ticker}</strong></td>
              <td class="text-right">${avgPrice}</td>
              <td class="text-right"><span class="badge ${badgeClass}">${ret}</span></td>
            </tr>`;
          });
          document.getElementById('resume-table-body').innerHTML = html;
        }

        // 3. Render Table Tahunan
        if (data.tahunan && data.tahunan.length > 1) {
          let html = '';
          for (let i = 1; i < data.tahunan.length; i++) {
            const row = data.tahunan[i];
            html += `<tr><td><strong>${row[0]}</strong></td><td class="text-right">${row[1] || '-'}</td></tr>`;
          }
          document.getElementById('tahunan-table-body').innerHTML = html;
        }

        // 4. Render Table Bulanan
        if (data.bulanan && data.bulanan.length > 1) {
          let html = '';
          for (let i = 1; i < data.bulanan.length; i++) {
            const row = data.bulanan[i];
            html += `<tr><td><strong>${row[0]}</strong></td><td class="text-right">${row[1] || '-'}</td></tr>`;
          }
          document.getElementById('bulanan-table-body').innerHTML = html;
        }

      } catch (error) {
        console.error('Gagal mengambil data:', error);
        document.getElementById('alltime-return').innerText = 'Offline';
      }
    }

    fetchDashboardData();
  </script>
</body>
</html>
